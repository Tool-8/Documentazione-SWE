name: Compilazione LaTeX e pubblicazione su GitHub Pages
on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/tool-8/texlive-custom:latest
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Pulisci PDF e hash
        run: |
          echo "Pulizia completa in corso..."

          rm -f Verbali/Interni/*.pdf 2>/dev/null || true
          rm -f Verbali/Esterni/*.pdf 2>/dev/null || true
          rm -f PB/*.pdf 2>/dev/null || true
          rm -f Glossario/*.pdf 2>/dev/null || true

          rm -rf .tex_hashes

          echo "Pulizia completata"

      - name: Rimuovi PDF dal tracking Git (se presenti)
        run: |
          git rm -f Verbali/Interni/*.pdf 2>/dev/null || true
          git rm -f Verbali/Esterni/*.pdf 2>/dev/null || true
          git rm -f PB/*.pdf 2>/dev/null || true
          git rm -f Glossario/*.pdf 2>/dev/null || true

      - name: Cache LaTeX aux files
        id: latex-cache
        uses: actions/cache@v4
        with:
          path: |
            **/.latex_aux
            .tex_hashes
          key: latexmk-${{ runner.os }}-${{ github.sha }}
          restore-keys: |
            latexmk-${{ runner.os }}-

      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Genera sezioni glossario
        run: python Glossario/entry_point.py

      - name: Aggiungi tag $^G$ ai documenti
        run: python Glossario/addGinDoc.py

      - name: Compila verbali interni
        if: steps.latex-cache.outputs.cache-hit != 'true'
        run: |
          mkdir -p .tex_hashes
          
          for file in Verbali/Interni/Latex/*.tex; do
            [ -f "$file" ] || continue
          
            filename=$(basename "$file" .tex)
            basedir=$(dirname "$file")
            hash_file=".tex_hashes/$(echo "$file" | tr '/' '_').hash"
            dest_dir="$(pwd)/Verbali/Interni"
          
            # Calcola hash attuale
            current_hash=$(md5sum "$file" | cut -d' ' -f1)
            previous_hash=$(cat "$hash_file" 2>/dev/null || echo "")
          
            if [ "$current_hash" = "$previous_hash" ]; then
              echo "Skipping $file (non modificato)"
              continue
            fi
          
            echo "Compilo $file..."
            cd "$basedir"
            latexmk -pdf -interaction=nonstopmode -file-line-error \
              -aux-directory=.latex_aux \
              "$(basename "$file")" || true
          
            if [ -f "${filename}.pdf" ]; then
              mkdir -p "$dest_dir"
              mv "${filename}.pdf" "$dest_dir/"
            fi
            cd - > /dev/null
          
            # Salva il nuovo hash solo se compilato con successo
            echo "$current_hash" > "$hash_file"
          done

      - name: Compila verbali esterni
        if: steps.latex-cache.outputs.cache-hit != 'true'
        run: |
          mkdir -p .tex_hashes
          
          for file in Verbali/Esterni/Latex/*.tex; do
            [ -f "$file" ] || continue
          
            filename=$(basename "$file" .tex)
            basedir=$(dirname "$file")
            hash_file=".tex_hashes/$(echo "$file" | tr '/' '_').hash"
            dest_dir="$(pwd)/Verbali/Esterni"
          
            # Calcola hash attuale
            current_hash=$(md5sum "$file" | cut -d' ' -f1)
            previous_hash=$(cat "$hash_file" 2>/dev/null || echo "")
          
            if [ "$current_hash" = "$previous_hash" ]; then
              echo "Skipping $file (non modificato)"
              continue
            fi
          
            echo "Compilo $file..."
            cd "$basedir"
            latexmk -pdf -interaction=nonstopmode -file-line-error \
              -aux-directory=.latex_aux \
              "$(basename "$file")" || true
          
            if [ -f "${filename}.pdf" ]; then
              mkdir -p "$dest_dir"
              mv "${filename}.pdf" "$dest_dir/"
            fi
            cd - > /dev/null
          
            # Salva il nuovo hash solo se compilato con successo
            echo "$current_hash" > "$hash_file"
          done

      - name: Compila documenti PB
        if: steps.latex-cache.outputs.cache-hit != 'true'
        run: |
          mkdir -p .tex_hashes
          
          for file in PB/latex/*.tex; do
            [ -f "$file" ] || continue
          
            filename=$(basename "$file" .tex)
            basedir=$(dirname "$file")
            hash_file=".tex_hashes/$(echo "$file" | tr '/' '_').hash"
            dest_dir="$(pwd)/PB"
          
            # Calcola hash attuale
            current_hash=$(md5sum "$file" | cut -d' ' -f1)
            previous_hash=$(cat "$hash_file" 2>/dev/null || echo "")
          
            if [ "$current_hash" = "$previous_hash" ]; then
              echo "Skipping $file (non modificato)"
              continue
            fi
          
            echo "Compilo $file..."
            cd "$basedir"
            latexmk -pdf -interaction=nonstopmode -file-line-error \
              -aux-directory=.latex_aux \
              "$(basename "$file")" || true
          
            if [ -f "${filename}.pdf" ]; then
              mkdir -p "$dest_dir"
              mv "${filename}.pdf" "$dest_dir/"
            fi
            cd - > /dev/null
          
            # Salva il nuovo hash solo se compilato con successo
            echo "$current_hash" > "$hash_file"
          done

      - name: Compila Glossario
        if: steps.latex-cache.outputs.cache-hit != 'true'
        run: |
          mkdir -p .tex_hashes
          
          for file in Glossario/*.tex; do
            [ -f "$file" ] || continue
          
            filename=$(basename "$file" .tex)
            basedir=$(dirname "$file")
            hash_file=".tex_hashes/$(echo "$file" | tr '/' '_').hash"
          
            # Calcola hash attuale
            current_hash=$(md5sum "$file" | cut -d' ' -f1)
            previous_hash=$(cat "$hash_file" 2>/dev/null || echo "")
          
            if [ "$current_hash" = "$previous_hash" ]; then
              echo "Skipping $file (non modificato)"
              continue
            fi
          
            echo "Compilo $file..."
            cd "$basedir"
            latexmk -pdf -interaction=nonstopmode -file-line-error \
              -aux-directory=.latex_aux \
              "$(basename "$file")" || true
          
            if [ -f "${filename}.pdf" ]; then
              echo "PDF generato: $basedir/${filename}.pdf"
            else
              echo "ATTENZIONE: PDF non generato per $filename"
            fi
            cd - > /dev/null
          
            # Salva il nuovo hash solo se compilato con successo
            echo "$current_hash" > "$hash_file"
          done

      - name: Verifica PDFs generati
        run: |
          echo "=== PDFs Verbali Interni ==="
          ls -lh Verbali/Interni/*.pdf 2>/dev/null || echo "Nessun PDF interno trovato"
          echo "=== PDFs Verbali Esterni ==="
          ls -lh Verbali/Esterni/*.pdf 2>/dev/null || echo "Nessun PDF esterno trovato"
          echo "=== PDFs Documenti PB ==="
          ls -lh PB/*.pdf 2>/dev/null || echo "Nessun PDF documento trovato"
          echo "=== PDF Glossario ==="
          ls -lh Glossario/*.pdf 2>/dev/null || echo "Nessun PDF glossario trovato"

      - name: Prepara output per GitHub Pages
        run: |
          mkdir -p output/verbali_interni
          mkdir -p output/verbali_esterni
          mkdir -p output/pb
          mkdir -p output/glossario
          
          cp .github/templates/index.html output/
          cp .github/templates/logo.png output/ 2>/dev/null || echo "Logo non trovato"
          
          if ls Verbali/Interni/*.pdf 1> /dev/null 2>&1; then
            cp Verbali/Interni/*.pdf output/verbali_interni/
            echo "Copiati $(ls Verbali/Interni/*.pdf | wc -l) PDF interni"
          fi
          
          if ls Verbali/Esterni/*.pdf 1> /dev/null 2>&1; then
            cp Verbali/Esterni/*.pdf output/verbali_esterni/
            echo "Copiati $(ls Verbali/Esterni/*.pdf | wc -l) PDF esterni"
          fi

          if ls PB/*.pdf 1> /dev/null 2>&1; then
            cp PB/*.pdf output/pb/
            echo "Copiati $(ls PB/*.pdf | wc -l) documenti"
          else
            echo "Nessun documento PB trovato"
          fi

          if ls Glossario/*.pdf 1> /dev/null 2>&1; then
            cp Glossario/*.pdf output/glossario/
            echo "Copiati $(ls Glossario/*.pdf | wc -l) PDF glossario"
          else
            echo "Nessun PDF glossario trovato"
          fi

      - name: Genera indice dei verbali
        run: |
          generate_json() {
            local dir=$1
            local output_file=$2
          
            echo '{"files":[' > "$output_file"
          
            local first=true
            for pdf in "$dir"/*.pdf; do
              if [ -f "$pdf" ]; then
                if [ "$first" = "false" ]; then
                  printf ',' >> "$output_file"
                fi
                printf '"%s"' "$(basename "$pdf")" >> "$output_file"
                first=false
              fi
            done
          
            echo ']}' >> "$output_file"
          }
          
          generate_json "output/verbali_interni" "output/verbali_interni/index.json"
          generate_json "output/verbali_esterni" "output/verbali_esterni/index.json"
          generate_json "output/pb" "output/pb/index.json"
          generate_json "output/glossario" "output/glossario/index.json"
          
          echo "Indici JSON generati"
          echo "=== Verbali Interni ==="
          cat output/verbali_interni/index.json
          echo ""
          echo "=== Verbali Esterni ==="
          cat output/verbali_esterni/index.json
          echo ""
          echo "=== PB ==="
          cat output/pb/index.json
          echo ""
          echo "=== Glossario ==="
          cat output/glossario/index.json

      - name: Carica PDFs come artifacts
        uses: actions/upload-artifact@v4
        with:
          name: pdfs-generati
          path: |
            Verbali/Interni/*.pdf
            Verbali/Esterni/*.pdf
            PB/*.pdf
            Glossario/*.pdf
          if-no-files-found: warn

      - name: Commit PDFs su main
        run: |
          git config --global --add safe.directory /__w/Documentazione-SWE/Documentazione-SWE
          git config --global user.name "GitHub Actions"
          git config --global user.email "actions@github.com"
          git add Verbali/Interni/*.pdf Verbali/Esterni/*.pdf PB/*.pdf Glossario/*.pdf
          git diff --staged --quiet || git commit -m "Aggiorna PDFs compilati [skip ci]"
          git push

      - name: Pubblica su GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./output
