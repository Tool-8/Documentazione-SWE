name: Auto PR

on:
  push:
    branches-ignore:
      - 'main'

permissions:
  contents: read
  pull-requests: write

jobs:
  create-pull-request:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Create Pull Request
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          BRANCH_NAME: ${{ github.ref_name }}
        run: |
          gh pr create \
            --base main \
            --head "${BRANCH_NAME}" \
            --title "Auto PR: ${BRANCH_NAME}" \
            --body "PR generata automaticamente dal workflow" \
            || echo "PR già esistente o impossibile creare"
